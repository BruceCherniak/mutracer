[package]
name = "mutracer-viewer"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
mutracer-native-probe = { path = "../host" }
anyhow = "1"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"] }
gltf = { version = "=1.4.1", features = ["KHR_materials_ior", "KHR_materials_transmission", "KHR_materials_emissive_strength", "KHR_materials_unlit", "KHR_texture_transform"] }
glam = "=0.30.9"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "hdr"] }
rfd = "=0.15.4"
