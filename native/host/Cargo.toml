[package]
name = "mutracer-native-probe"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
anyhow = "1"
libloading = "=0.8.9"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal", "wgsl"] }
pollster = "=0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "=0.18.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLAccelerationStructureTypes"] }

[build-dependencies]
cc = "=1.8.0"

[features]
fuzzing = []

[[bin]]
name = "fuzz-seed"
path = "src/bin/fuzz-seed.rs"
required-features = ["fuzzing"]
