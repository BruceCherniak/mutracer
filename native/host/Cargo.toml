[package]
name = "mutracer-native-probe"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
anyhow = "1"
libloading = "=0.8.9"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }
pollster = "=0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "=0.18.1"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"] }
objc2 = "=0.6.5"
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLAccelerationStructureTypes"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12", "vulkan"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan"] }

[build-dependencies]
cc = "=1.8.0"
serde_json = "1"

[dev-dependencies]
naga = { version = "=30.0.1", features = ["spv-out", "hlsl-out"] }

[features]
fuzzing = []
# Opt-in stage-gate observations; never enabled by the native API/viewer.
validation = []

[[bin]]
name = "fuzz-seed"
path = "diagnostics/fuzz-seed.rs"
required-features = ["fuzzing"]

[[bin]]
name = "closest-diagnostics"
path = "diagnostics/closest-diagnostics.rs"

[[bin]]
name = "gpu-availability"
path = "diagnostics/gpu-availability.rs"

[[bin]]
name = "hit-diagnostics"
path = "diagnostics/hit-diagnostics.rs"

[[bin]]
name = "image-diagnostics"
path = "diagnostics/image-diagnostics.rs"

[[bin]]
name = "path-diagnostics"
path = "diagnostics/path-diagnostics.rs"

[[bin]]
name = "prepare-diagnostics"
path = "diagnostics/prepare-diagnostics.rs"

[[bin]]
name = "ray-query-probe"
path = "diagnostics/ray-query-probe.rs"

[[bin]]
name = "validate-shaders"
path = "diagnostics/validate-shaders.rs"
