[package]
name = "mutracer-native-probe"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal", "wgsl"] }
pollster = "=0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "=0.18.1"

[build-dependencies]
cc = "=1.8.0"
