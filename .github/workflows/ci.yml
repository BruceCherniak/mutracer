name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Typecheck library, examples, viewer and site
        run: |
          npm run typecheck
          npm run typecheck:examples
          npm run typecheck:viewer
          npm run typecheck:site
      - run: npm test
      - run: npm run build
      - run: npm run check:lib-esm
