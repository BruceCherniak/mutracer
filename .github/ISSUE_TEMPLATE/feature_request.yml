name: Feature request
description: Suggest an improvement to MuTracer.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe what you are trying to do and the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the result you would like, including alternatives you have considered.
    validations:
      required: true
